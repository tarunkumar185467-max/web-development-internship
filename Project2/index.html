<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Task Manager</h1>
        <p>Contact Form & Dynamic To-Do List</p>
    </header>


    <!-- Navigation using Flexbox -->
    <nav>
        <a href="#home">Home</a>
        <a href="#contact">Contact</a>
        <a href="#tasks">My Tasks</a>
    </nav>


    <!-- Main Content -->
    <main>

        <!-- Grid Container -->
        <div class="dashboard">


            <!-- Contact Form -->
            <section id="contact" class="card">

                <h2>Contact Me</h2>

                <p>
                    Fill out the form below to send a message.
                </p>

                <form id="contactForm">

                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                        >

                        <small id="nameError"></small>

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                        >

                        <small id="emailError"></small>

                    </div>


                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Write your message"
                        ></textarea>

                        <small id="messageError"></small>

                    </div>


                    <!-- Submit -->
                    <button type="submit">
                        Send Message
                    </button>

                    <p id="successMessage"></p>

                </form>

            </section>



            <!-- To-Do List -->
            <section id="tasks" class="card">

                <h2>My To-Do List</h2>

                <p>
                    Add your tasks and manage them dynamically.
                </p>


                <div class="todo-input">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a new task"
                    >

                    <button
                        id="addTaskBtn"
                        type="button"
                    >
                        Add Task
                    </button>

                </div>


                <!-- Tasks will appear here -->
                <ul id="taskList"></ul>

            </section>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Task Manager
        </p>

    </footer>

</body>

</html>
